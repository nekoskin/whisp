name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-build.yml'

jobs:
  ipa:
    runs-on: macos-15
    env:
      IOS_TRIPLE: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Select the newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "available: $(ls -d /Applications/Xcode_*.app 2>/dev/null | tr '\n' ' ')"
          [ -n "$LATEST" ] && sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Frontend + placeholder sidecars
        run: |
          npm ci
          npm i -D @tauri-apps/cli@2.10.1 @tauri-apps/api@2.10.1
          npm run build
          mkdir -p src-tauri/binaries
          for n in mihomo whispera-go-client; do : > "src-tauri/binaries/${n}-${IOS_TRIPLE}"; done

      - name: tauri ios init
        run: npx tauri ios init --ci 2>&1 | tee "$RUNNER_TEMP/init.log" | tail -15

      - name: What was generated
        run: |
          echo "=== gen/apple ==="; ls -laR src-tauri/gen/apple 2>&1 | head -50
          WS=$(ls -d src-tauri/gen/apple/*.xcworkspace 2>/dev/null | head -1)
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj 2>/dev/null | head -1)
          echo "workspace=[$WS] project=[$PROJ]"
          { [ -n "$WS" ] && xcodebuild -list -workspace "$WS"; } 2>&1 | tee "$RUNNER_TEMP/schemes.log" || true
          [ -z "$WS" ] && xcodebuild -list -project "$PROJ" 2>&1 | tee "$RUNNER_TEMP/schemes.log" || true

      - name: Disable signing in project.yml, regenerate, dump
        run: |
          Y=src-tauri/gen/apple/project.yml
          cp "$Y" "$RUNNER_TEMP/project.yml.orig"
          python3 - "$Y" <<'PY'
          import sys, io
          p = sys.argv[1]
          t = io.open(p, encoding="utf-8").read()
          off = (
              "    CODE_SIGNING_ALLOWED: \"NO\"\n"
              "    CODE_SIGNING_REQUIRED: \"NO\"\n"
              "    CODE_SIGN_IDENTITY: \"\"\n"
              "    DEVELOPMENT_TEAM: \"\"\n"
          )
          # add to top-level settings.base if present, else create it
          if "\nsettings:" in t:
              import re
              m = re.search(r"\nsettings:\n(  base:\n)?", t)
              ins = m.end()
              t = t[:ins] + off + t[ins:]
          else:
              t += "\nsettings:\n  base:\n" + off
          io.open(p, "w", encoding="utf-8").write(t)
          print("patched project.yml")
          PY
          echo "::group::project.yml"; cat "$Y"; echo "::endgroup::"
          cp "$Y" "$RUNNER_TEMP/project.yml"
          ( cd src-tauri/gen/apple && xcodegen generate ) 2>&1 | tail -5 || true

      - name: Build via tauri with signing off
        id: build
        continue-on-error: true
        run: |
          npx tauri ios build --ci 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -60

      - name: Collect the .ipa (or package the .app)
        if: always()
        run: |
          echo "=== products under gen/apple ==="
          find src-tauri/gen/apple \( -name '*.ipa' -o -name '*.app' -o -name '*.xcarchive' \) 2>/dev/null | head
          IPA=$(find src-tauri/gen/apple -name '*.ipa' 2>/dev/null | head -1)
          if [ -n "$IPA" ]; then
            cp "$IPA" "$RUNNER_TEMP/Whisp-unsigned.ipa"; echo "ipa: $IPA"
          else
            APP=$(find src-tauri/gen/apple -name '*.app' -path '*iphoneos*' 2>/dev/null | head -1)
            [ -z "$APP" ] && APP=$(find src-tauri/gen/apple -name '*.app' 2>/dev/null | head -1)
            if [ -n "$APP" ]; then
              mkdir -p "$RUNNER_TEMP/Payload"; cp -R "$APP" "$RUNNER_TEMP/Payload/"
              (cd "$RUNNER_TEMP" && zip -qr Whisp-unsigned.ipa Payload); echo "packaged from: $APP"
            else
              echo "no .app or .ipa produced"
            fi
          fi
          ls -la "$RUNNER_TEMP"/*.ipa 2>/dev/null || true

      - name: Annotate project.yml and logs
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/project.yml" "$RUNNER_TEMP/build.log" <<'PY'
          import sys, re
          out = ""
          for p in sys.argv[1:]:
              try: t = open(p, errors="replace").read()
              except OSError: continue
              t = re.sub(r"\x1b\[[0-9;]*m", "", t)
              if p.endswith("project.yml"):
                  out += "--- project.yml\n" + t[:4000] + "\n"; continue
              errs = [l for l in t.splitlines() if any(k in l for k in ("error", "Error", "fatal", "Unable", "No such", "requires a provisioning", "Signing", "** BUILD", "Finished"))]
              out += f"--- {p}\n" + ("\n".join(errs[-50:]) or t[-4000:]) + "\n"
          for a,b in (("%","%25"),("\r","%0D"),("\n","%0A")): out = out.replace(a,b)
          print("::error title=ios build::" + out[:9000])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa
          path: |
            ${{ runner.temp }}/*.ipa
            ${{ runner.temp }}/*.log
