name: Release Whisp Client

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Whisp (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: .exe
            mihomo_asset: mihomo-windows-amd64
            mihomo_archive: zip
            bundle_glob: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - label: linux-x86_64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            ext: ""
            mihomo_asset: mihomo-linux-amd64
            mihomo_archive: gz
            bundle_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
          - label: macos-universal
            runner: macos-15
            triple: universal-apple-darwin
            universal: true
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            ext: ""
            mihomo_asset: mihomo-darwin
            mihomo_arches: arm64 amd64
            mihomo_archive: gz
            bundle_glob: |
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        shell: bash
        run: |
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "tag=v${VER}" >> $GITHUB_OUTPUT
          CODE=$(echo "$VER" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
          jq --argjson c "$CODE" '.bundle.android.versionCode = $c' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \".*\"/version = \"$VER\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
          echo "Whisp version=$VER versionCode=$CODE"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.triple }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.triple }}

      - name: Install Linux Tauri deps
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Resolve Whispera version
        id: wver
        shell: bash
        run: |
          # Use version pinned by dispatch payload; fall back to latest tag.
          PINNED="${{ github.event.client_payload.version }}"
          if [ -n "$PINNED" ]; then
            echo "tag=$PINNED" >> $GITHUB_OUTPUT
            echo "Using pinned version: $PINNED"
          else
            TAG=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/nekoskin/whispera/releases/latest" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "Using latest version: $TAG"
          fi

      - name: Download whispera-go-client
        if: '!matrix.universal'
        uses: robinraju/release-downloader@v1.10
        with:
          repository: nekoskin/whispera
          tag: ${{ steps.wver.outputs.tag }}
          fileName: 'whispera-go-client-${{ matrix.triple }}${{ matrix.ext }}'
          out-file-path: src-tauri/binaries/
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download whispera-go-client for every macOS architecture
        if: matrix.universal
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download "${{ steps.wver.outputs.tag }}" -R nekoskin/whispera \
            -p 'whispera-go-client-*-apple-darwin' -D go-client-darwin
          OUT="src-tauri/binaries/whispera-go-client-${{ matrix.triple }}"
          lipo -create -output "$OUT" go-client-darwin/*
          lipo -info "$OUT"
          rm -rf go-client-darwin
          for T in $(echo "${{ matrix.rust_targets }}" | tr ',' ' '); do
            cp "$OUT" "src-tauri/binaries/whispera-go-client-${T}"
          done

      - name: Download mihomo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MIHOMO_VER="v1.19.28"
          ASSET="${{ matrix.mihomo_asset }}"
          ARCH="${{ matrix.mihomo_archive }}"
          OUT="src-tauri/binaries/mihomo-${{ matrix.triple }}${{ matrix.ext }}"
          mkdir -p src-tauri/binaries
          BASE_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VER}"
          if [ "${{ matrix.universal }}" = "true" ]; then
            PARTS=""
            for A in ${{ matrix.mihomo_arches }}; do
              curl -fsSL --retry 3 --retry-delay 5 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "${BASE_URL}/${ASSET}-${A}-${MIHOMO_VER}.gz" -o "mihomo-${A}.gz"
              gunzip -f "mihomo-${A}.gz"
              PARTS="$PARTS mihomo-${A}"
            done
            lipo -create -output "$OUT" $PARTS
            lipo -info "$OUT"
            rm -f $PARTS
            chmod +x "$OUT"
            for T in $(echo "${{ matrix.rust_targets }}" | tr ',' ' '); do
              cp "$OUT" "src-tauri/binaries/mihomo-${T}"
            done
          elif [ "$ARCH" = "zip" ]; then
            curl -fsSL --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "${BASE_URL}/${ASSET}-${MIHOMO_VER}.zip" -o mihomo.zip
            unzip -o mihomo.zip -d mihomo_tmp/
            mv mihomo_tmp/${ASSET}.exe "$OUT" 2>/dev/null || mv mihomo_tmp/mihomo*.exe "$OUT"
            rm -rf mihomo.zip mihomo_tmp/
          else
            curl -fsSL --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "${BASE_URL}/${ASSET}-${MIHOMO_VER}.gz" -o mihomo.gz
            gunzip -f mihomo.gz
            mv mihomo "$OUT"
            chmod +x "$OUT"
          fi

      - name: Make binaries executable (unix)
        if: matrix.runner != 'windows-latest'
        run: chmod +x src-tauri/binaries/*

      - name: Install frontend deps
        run: npm ci

      - name: Generate icon.icns
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          set -e
          SRC=src-tauri/icons/128x128@2x.png
          OUT=src-tauri/icons/icon.icns
          [ -f "$OUT" ] && exit 0
          if command -v iconutil >/dev/null 2>&1 && command -v sips >/dev/null 2>&1; then
            ICONSET=$(mktemp -d)/icon.iconset
            mkdir -p "$ICONSET"
            for s in 16 32 64 128 256 512 1024; do
              sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
              [ $s -le 512 ] && sips -z $((s*2)) $((s*2)) "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null || true
            done
            iconutil -c icns "$ICONSET" -o "$OUT"
          else
            python3 -m pip install --quiet --user Pillow
            python3 -c "from PIL import Image; Image.open('$SRC').resize((1024,1024), Image.LANCZOS).save('/tmp/icon-1024.png')"
            npx tauri icon /tmp/icon-1024.png
          fi
          ls -la "$OUT"

      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\tauri' || runner.os == 'macOS' && '~/Library/Caches/tauri' || '~/.cache/tauri' }}
          key: tauri-bundler-${{ matrix.triple }}-${{ hashFiles('package-lock.json') }}

      - name: Build Tauri app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: только app + tar.gz (DMG bundle_dmg.sh флачит на CI hdiutil).
          TAURI_ARGS: --target ${{ matrix.triple }}${{ contains(matrix.triple, 'apple-darwin') && ' --bundles app' || '' }}${{ contains(matrix.triple, 'linux') && ' --bundles deb,rpm,appimage' || '' }}
        run: |
          read -ra args <<< "$TAURI_ARGS"
          for attempt in 1 2; do
            npm run tauri build -- "${args[@]}" && exit 0
            echo "tauri build failed on attempt $attempt; a bundler download can time out, so it runs once more"
          done
          exit 1

      - name: Pack portable Linux tarball
        if: matrix.label == 'linux-x86_64'
        shell: bash
        run: |
          BIN=src-tauri/target/${{ matrix.triple }}/release
          OUT=whisp-linux-x86_64
          mkdir -p "$OUT"
          cp "$BIN/Whisp" "$OUT/" 2>/dev/null || cp "$BIN/whisp" "$OUT/"
          cp "$BIN/mihomo" "$OUT/" 2>/dev/null || cp src-tauri/binaries/mihomo-${{ matrix.triple }} "$OUT/mihomo"
          cp "$BIN/whispera-go-client" "$OUT/" 2>/dev/null || cp src-tauri/binaries/whispera-go-client-${{ matrix.triple }} "$OUT/whispera-go-client"
          chmod +x "$OUT"/*
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          tar -czf "Whisp_${VER}_linux-x86_64.tar.gz" "$OUT"
          ls -la Whisp_*_linux-x86_64.tar.gz

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisp-${{ matrix.label }}-installer
          path: |
            ${{ matrix.bundle_glob }}
            Whisp_*_linux-x86_64.tar.gz
          retention-days: 5
          if-no-files-found: ignore

  # ── Android Build ──────────────────────────────────────────────────────────
  build-android:
    name: Build Whisp (Android)
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_RUST_TARGETS: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      ANDROID_GOMOBILE_TARGETS: android/arm64,android/arm,android/amd64
      ANDROID_TAURI_TARGETS: aarch64 armv7 x86_64
      ANDROID_ABIS: arm64-v8a armeabi-v7a x86_64
      ANDROID_BUILD_ATTEMPTS: 2
      GRADLE_NETWORK_TIMEOUT_MS: 120000
      GRADLE_DOWNLOAD_TENTATIVES: 6
      GRADLE_DOWNLOAD_BACKOFF_MS: 2000
      ANDROID_KEY_ALIAS: androiddebugkey
      ANDROID_KEYSTORE_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        shell: bash
        run: |
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "tag=v${VER}" >> $GITHUB_OUTPUT
          CODE=$(echo "$VER" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
          jq --argjson c "$CODE" '.bundle.android.versionCode = $c' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \".*\"/version = \"$VER\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
          echo "Whisp version=$VER versionCode=$CODE"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }}'

      - name: Use the tested NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            go-android/go.sum

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ANDROID_RUST_TARGETS }}

      - name: Cache Rust build (Android)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock', 'src-tauri/android-patch/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock', 'src-tauri/android-patch/**') }}-
            gradle-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Resolve whispera version (Android)
        id: wver
        shell: bash
        run: |
          PINNED="${{ github.event.client_payload.version }}"
          if [ -n "$PINNED" ]; then
            echo "tag=$PINNED" >> $GITHUB_OUTPUT
          else
            TAG=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/nekoskin/whispera/releases/latest" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Checkout whispera source (in-process go-client AAR)
        uses: actions/checkout@v4
        with:
          repository: nekoskin/whispera
          ref: ${{ steps.wver.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: whispera-src

      - name: Download whispera-go-client (arm64)
        uses: robinraju/release-downloader@v1.10
        with:
          repository: nekoskin/whispera
          tag: ${{ steps.wver.outputs.tag }}
          fileName: 'whispera-go-client-aarch64-linux-android'
          out-file-path: src-tauri/binaries/
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: chmod +x sidecars
        run: chmod +x src-tauri/binaries/* 2>/dev/null || true

      - name: Install frontend deps
        run: npm ci

      - name: Upscale icon source to 1024x1024 for Tauri icon generator
        run: |
          python3 -m pip install --quiet --user Pillow
          mkdir -p src-tauri/icons-tmp
          python3 -c "from PIL import Image; Image.open('src-tauri/icons/128x128@2x.png').resize((1024,1024), Image.LANCZOS).save('src-tauri/icons-tmp/source.png')"
          npx tauri icon src-tauri/icons-tmp/source.png

      - name: Initialize Tauri Android project
        run: |
          export NDK_HOME="$ANDROID_NDK_HOME"
          npx tauri android init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sing-box AAR via gomobile
        shell: bash
        env:
          GONOSUMDB: "*"
          GOFLAGS: "-mod=mod"
          GOTOOLCHAIN: local
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          modver() { (cd go-android && go mod edit -json | jq -r --arg p "$1" '.Require[] | select(.Path == $p) | .Version'); }
          MOBILE_VER="$(modver golang.org/x/mobile)"
          SB_VER="$(modver github.com/sagernet/sing-box)"
          for attempt in 1 2 3; do
            go install "golang.org/x/mobile/cmd/gomobile@${MOBILE_VER}" \
              && go install "golang.org/x/mobile/cmd/gobind@${MOBILE_VER}" && break
            echo "module proxy failed (attempt $attempt), retrying"
            sleep 15
          done
          command -v gomobile >/dev/null || { echo "gomobile could not be installed"; exit 1; }
          mkdir -p src-tauri/gen/android/app/libs
          cd go-android
          go mod download github.com/sagernet/sing-box || true
          SB_MOD="$(go env GOPATH)/pkg/mod/github.com/sagernet/sing-box@${SB_VER}"
          cp -r "$SB_MOD" ./sing-box-patched
          chmod -R u+w ./sing-box-patched
          go run ./cmd/patch ./sing-box-patched
          echo "" >> go.mod
          echo "replace github.com/sagernet/sing-box ${SB_VER} => ./sing-box-patched" >> go.mod
          go mod tidy
          export NDK_HOME="$ANDROID_NDK_HOME"
          gomobile bind \
            -target="$ANDROID_GOMOBILE_TARGETS" \
            -androidapi=21 \
            -tags with_gvisor \
            -ldflags="-checklinkname=0 -s -w" \
            -o ../src-tauri/gen/android/app/libs/singbox.aar \
            . github.com/nekoskin/whispera/app/goclient/mobile
          ls -lh ../src-tauri/gen/android/app/libs/singbox.aar

      - name: Apply VpnService patch (Kotlin + manifest)
        run: bash src-tauri/android-patch/apply.sh

      - name: Configure Gradle downloads and the singbox.aar init script
        run: |
          mkdir -p ~/.gradle/init.d
          cp src-tauri/android-patch/singbox.gradle ~/.gradle/init.d/singbox.gradle
          {
            echo "systemProp.org.gradle.internal.http.connectionTimeout=$GRADLE_NETWORK_TIMEOUT_MS"
            echo "systemProp.org.gradle.internal.http.socketTimeout=$GRADLE_NETWORK_TIMEOUT_MS"
            echo "systemProp.org.gradle.internal.repository.max.tentatives=$GRADLE_DOWNLOAD_TENTATIVES"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=$GRADLE_DOWNLOAD_BACKOFF_MS"
          } >> ~/.gradle/gradle.properties
          WRAPPER=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/^networkTimeout=/d' "$WRAPPER"
          echo "networkTimeout=$GRADLE_NETWORK_TIMEOUT_MS" >> "$WRAPPER"

      - name: Restore stable Android signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "Restored stable debug keystore ($(stat -c%s ~/.android/debug.keystore) bytes)"
            {
              echo "android.injected.signing.store.file=$HOME/.android/debug.keystore"
              echo "android.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              echo "android.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              echo "android.injected.signing.key.password=$ANDROID_KEYSTORE_PASSWORD"
            } >> ~/.gradle/gradle.properties
            echo "ANDROID_SIGNING_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_B64 not set — falling back to ephemeral debug keystore"
          fi

      - name: Build Tauri Android APK (debug, auto-signed)
        id: tauri_build
        run: |
          export NDK_HOME="$ANDROID_NDK_HOME"
          read -ra targets <<< "$ANDROID_TAURI_TARGETS"
          set +e
          for attempt in $(seq "$ANDROID_BUILD_ATTEMPTS"); do
            npx tauri android build --apk --debug --target "${targets[@]}" --verbose >> tauri-build.log 2>&1
            BUILD_EXIT=$?
            [ "$BUILD_EXIT" -eq 0 ] && break
            echo "tauri android build failed on attempt $attempt with exit code $BUILD_EXIT" | tee -a tauri-build.log
          done
          set -e
          echo "exit_code=$BUILD_EXIT" >> $GITHUB_OUTPUT
          exit $BUILD_EXIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the universal APK
        run: |
          mkdir -p apk-out
          find src-tauri/gen/android -path "*outputs/apk*" -name "*universal*.apk" -exec cp {} apk-out/ \;
          ls -l apk-out

      - name: Build Tauri Android APK per ABI (debug, auto-signed)
        run: |
          export NDK_HOME="$ANDROID_NDK_HOME"
          read -ra targets <<< "$ANDROID_TAURI_TARGETS"
          for attempt in $(seq "$ANDROID_BUILD_ATTEMPTS"); do
            npx tauri android build --apk --debug --split-per-abi --target "${targets[@]}" --verbose >> tauri-build.log 2>&1 && exit 0
            echo "tauri android per-ABI build failed on attempt $attempt" | tee -a tauri-build.log
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Name per-ABI APKs
        shell: bash
        run: |
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          find src-tauri/gen/android -path "*outputs/apk*" -name "*.apk" ! -name "*universal*" | while read -r apk; do
            abi=$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u | paste -sd, -)
            case " $ANDROID_ABIS " in
              *" $abi "*) cp "$apk" "apk-out/Whisp_${VER}_android-${abi}.apk" ;;
              *) echo "skipping $apk with native libraries for: ${abi:-none}" ;;
            esac
          done
          ls -l apk-out
          for abi in $ANDROID_ABIS; do
            test -f "apk-out/Whisp_${VER}_android-${abi}.apk" || { echo "no APK for $abi"; exit 1; }
          done

      - name: Check the APKs are signed with the stable keystore
        if: env.ANDROID_SIGNING_KEYSTORE != ''
        run: |
          want=$(keytool -list -v -keystore "$ANDROID_SIGNING_KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d : | tr A-F a-f)
          [ -n "$want" ] || { echo "::error::no certificate for $ANDROID_KEY_ALIAS in the restored keystore"; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in apk-out/*.apk; do
            out=$("$apksigner" verify --print-certs "$apk")
            got=$(sed -n 's/.*certificate SHA-256 digest: //p' <<< "$out" | sort -u)
            echo "$apk: $got"
            [ "$got" = "$want" ] || { echo "$out"; echo "::error::$apk is not signed with the ANDROID_KEYSTORE_B64 key $want"; exit 1; }
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-build-log
          path: tauri-build.log
          if-no-files-found: warn

      - name: Show build errors
        if: failure()
        run: |
          if [ ! -f tauri-build.log ]; then echo "no build log"; exit 0; fi
          echo "##### FAILURE context (±20 lines) #####"
          grep -n "FAILURE\|What went wrong\|Caused by\|Unresolved\|error:" tauri-build.log \
            | awk -F: '{print $1}' | sort -nu | while read ln; do
                sed -n "$((ln>20?ln-20:1)),$((ln+20))p" tauri-build.log
                echo "---"
              done | head -300
          echo "##### tail 400 #####"
          tail -400 tauri-build.log

      - name: Locate APK
        run: |
          echo "=== APK files found ==="
          find src-tauri/gen/android -name "*.apk" 2>/dev/null || echo "(none)"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: whisp-android-apk
          path: apk-out/*.apk
          retention-days: 5
          if-no-files-found: warn

      - name: Save Gradle cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}${{ job.status != 'success' && format('-{0}', github.run_id) || '' }}

# ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-android]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: whisp-*-installer
          merge-multiple: true
          path: release/

      - uses: actions/download-artifact@v4
        with:
          name: whisp-android-apk
          path: release/
        continue-on-error: true

      - name: Calculate version
        id: ver
        run: |
          git fetch --tags
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          NEW="v${VER}"
          if git rev-parse "refs/tags/$NEW" >/dev/null 2>&1; then RELEASE=false; else RELEASE=true; fi
          echo "tag=$NEW" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "Whisp release tag=$NEW new=$RELEASE"

      - name: Write the updater manifest
        if: steps.ver.outputs.release == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os
          tag, base = os.environ["TAG"], os.environ["DOWNLOAD_BASE"]
          bundles = {
              "*.app.tar.gz": ["darwin-aarch64", "darwin-x86_64"],
              "*.AppImage": ["linux-x86_64"],
          }
          platforms = {}
          for pattern, targets in bundles.items():
              for path in glob.glob(os.path.join("release", "**", pattern), recursive=True):
                  if not os.path.exists(path + ".sig"):
                      continue
                  entry = {
                      "signature": open(path + ".sig").read().strip(),
                      "url": f"{base}/{tag}/{os.path.basename(path)}",
                  }
                  platforms.update({target: entry for target in targets})
          if not platforms:
              print("no signed bundles, the release goes out without an updater manifest")
              raise SystemExit(0)
          manifest = {
              "version": tag.lstrip("v"),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(manifest, open(os.path.join("release", "latest.json"), "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: whisp ${{ steps.ver.outputs.tag }}
          files: release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
