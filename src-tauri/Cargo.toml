[package]
name = "whisp"
version = "0.0.1"
description = "Whisp Desktop Client"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "whisp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"], default-features = false }
base64 = "0.22"
socket2 = "0.6"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
sha2 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "3"
getrandom = "0.3"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "~2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinInet", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "android")'.dependencies]
whisp-vpn-android = { path = "crates/whisp-vpn-android" }
tauri-plugin-barcode-scanner = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
members = ["crates/whisp-vpn-android"]


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
strip = "debuginfo"
