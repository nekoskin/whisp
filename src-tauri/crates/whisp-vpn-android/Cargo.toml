[package]
name = "whisp-vpn-android"
version = "0.1.0"
edition = "2021"
description = "Whisp Android glue: VpnService intents and the installed-package list, over JNI."
publish = false

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Tauri 2 на Android уже инициализирует ndk_context через свой JNI_OnLoad,
# поэтому android_context() возвращает рабочую пару (VM, Context) без нашей
# дополнительной инициализации.
ndk-context = "0.1"
